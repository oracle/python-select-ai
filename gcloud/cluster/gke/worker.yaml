apiVersion: apps/v1
kind: Deployment
metadata:
  name: select-ai-a2a-worker
  namespace: select-ai-a2a
spec:
  replicas: WORKER_REPLICAS
  selector:
    matchLabels:
      app: select-ai-a2a-worker
  template:
    metadata:
      labels:
        app: select-ai-a2a-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: select-ai-a2a-worker
          image: WORKER_IMAGE
          command:
            - select-ai
          args:
            - a2a
            - worker
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --consul-url
            - http://consul-server.select-ai-a2a.svc.cluster.local:8500
            - --worker-id
            - $(WORKER_ID)
            - --worker-endpoint
            - http://$(WORKER_ADDRESS):8080
            - --session-ttl-seconds
            - "SESSION_TTL_SECONDS"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
