apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: select-ai-a2a-worker
  namespace: select-ai-a2a
spec:
  serviceName: select-ai-a2a-worker
  replicas: WORKER_REPLICAS
  selector:
    matchLabels:
      app: select-ai-a2a-worker
  template:
    metadata:
      labels:
        app: select-ai-a2a-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: select-ai-a2a-worker
          image: WORKER_IMAGE
          command: [select-ai]
          args:
            - a2a
            - worker
            - --host
            - 0.0.0.0
            - --port
            - "8443"
            - --consul-url
            - http://consul-server.select-ai-a2a.svc.cluster.local:8500
            - --worker-id
            - $(WORKER_ID)
            - --worker-endpoint
            - https://$(POD_NAME).select-ai-a2a-worker.select-ai-a2a.svc.GKE_DNS_DOMAIN:8443
            - --session-ttl-seconds
            - "SESSION_TTL_SECONDS"
            - --tls-cert-file
            - /var/run/select-ai-mtls/tls.crt
            - --tls-key-file
            - /var/run/select-ai-mtls/tls.key
            - --tls-ca-file
            - /var/run/select-ai-mtls/server-ca.crt
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: worker-server-tls
              mountPath: /var/run/select-ai-mtls/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: worker-server-tls
              mountPath: /var/run/select-ai-mtls/tls.key
              subPath: tls.key
              readOnly: true
            - name: server-client-ca
              mountPath: /var/run/select-ai-mtls/server-ca.crt
              subPath: ca.crt
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
      volumes:
        - name: worker-server-tls
          secret:
            secretName: select-ai-a2a-worker-server-tls
        - name: server-client-ca
          secret:
            secretName: select-ai-a2a-server-client-ca
